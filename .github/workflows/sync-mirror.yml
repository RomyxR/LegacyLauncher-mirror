name: Sync Legacy Launcher Mirror

on:
  schedule:
    # Запуск каждые 6 часов (можно настроить под себя)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Позволяет запускать синхронизацию вручную кнопкой в интерфейсе GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and unpack latest source
        run: |
          mkdir -p /tmp/launcher-src
          curl -L "https://dl.legacylauncher.ru/legacy/source" -o /tmp/launcher.zip
          unzip -o /tmp/launcher.zip -d /tmp/launcher-src
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -r /tmp/launcher-src/* .

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff-index --quiet HEAD --; then
            echo "Никаких изменений не обнаружено. Зеркало актуально."
          else
            echo "Обнаружены изменения! Создаем коммит..."
            git commit -m "Обновление исходников: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
