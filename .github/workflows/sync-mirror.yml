name: Mirror sources

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:         # ручной запуск

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download archive
        run: |
          curl -fsSL -A "Mozilla/5.0" -o src.zip "https://dl.legacylauncher.ru/legacy/source"

      - name: Replace sources
        run: |
          rm -rf /tmp/new && mkdir /tmp/new
          unzip -q src.zip -d /tmp/new
          rm src.zip

          # если внутри одна корневая папка, поднимаем её содержимое на уровень выше
          if [ "$(ls -A /tmp/new | wc -l)" -eq 1 ] && [ -d "/tmp/new/$(ls /tmp/new)" ]; then
            SRC="/tmp/new/$(ls /tmp/new)"
          else
            SRC=/tmp/new
          fi

          # удаляем всё старое, кроме .git и самого workflow
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .

      - name: Commit if changed
        run: |
          git config user.name  "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "Update sources $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
