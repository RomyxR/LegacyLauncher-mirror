name: Mirror Source
on:
  workflow_dispatch:
permissions: {contents: write}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L --fail -o src.zip "https://dl.legacylauncher.ru/legacy/source"
          unzip -qo src.zip -d .tmp
          # Если в архиве одна папка — берём её, иначе .tmp
          shopt -s nullglob dotglob; e=(.tmp/*)
          [[ ${#e[@]} -eq 1 && -d "${e[0]}" ]] && SRC="${e[0]}" || SRC=".tmp"
          rsync -a --exclude=.git "$SRC"/ ./
          rm -rf .tmp src.zip
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update source"; git push; }
